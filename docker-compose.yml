services:
  postgres:
    image: postgres:16-alpine
    container_name: storeforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: storeforge
      POSTGRES_PASSWORD: storeforge
      POSTGRES_DB: storeforge
    volumes:
      - storeforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeforge -d storeforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: storeforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - storeforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storeforge_pg:
  storeforge_redis:
